name: 代码质量检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 类型检查与回归测试
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv
        run: python -m pip install uv==0.11.7
      - name: 安装锁定的开发依赖
        run: uv sync --locked --group dev
      - name: 执行完整质量检查
        run: .\scripts\checks\check_quality.ps1
